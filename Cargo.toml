[workspace]
resolver = "3"
members = [
  "crates/core",
  "crates/platform",
  "crates/resources",
  "crates/ui",
  "crates/integrations/clock",
  "crates/integrations/devices",
  "crates/integrations/usage",
  "crates/integrations/vscode",
  "crates/integrations/terminal",
  "crates/integrations/update",
  "crates/integrations/chat",
  "crates/integrations/systray",
  "crates/integrations/spotify",
  "crates/modules/bar",
  "crates/modules/island",
  "crates/platform-windows",
  "crates/app",
]

[workspace.package]
version = "1.3.1"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[workspace.dependencies]
zefiro-core = { path = "crates/core" }
zefiro-platform = { path = "crates/platform" }
zefiro-resources = { path = "crates/resources" }
zefiro-ui = { path = "crates/ui" }
zefiro-integration-clock = { path = "crates/integrations/clock" }
zefiro-integration-devices = { path = "crates/integrations/devices" }
zefiro-integration-usage = { path = "crates/integrations/usage" }
zefiro-integration-vscode = { path = "crates/integrations/vscode" }
zefiro-integration-terminal = { path = "crates/integrations/terminal" }
zefiro-integration-update = { path = "crates/integrations/update" }
zefiro-integration-chat = { path = "crates/integrations/chat" }
zefiro-integration-systray = { path = "crates/integrations/systray" }
zefiro-integration-spotify = { path = "crates/integrations/spotify" }
zefiro-bar = { path = "crates/modules/bar" }
zefiro-island = { path = "crates/modules/island" }
zefiro-platform-windows = { path = "crates/platform-windows" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"
notify = "8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tempfile = "3"
serde_json = "1"
windows-core = "=0.61.2"
windows-numerics = "=0.2.0"
windows = { version = "=0.61.3", features = [
  "Foundation", "Foundation_Collections", "Foundation_Numerics", "Graphics", "Graphics_DirectX", "Graphics_Imaging", "ApplicationModel", "Web", "Web_Http", "Web_Http_Filters", "Web_Http_Headers", "Devices", "Devices_Bluetooth", "Devices_Enumeration", "Media", "Media_Control", "UI_Notifications", "UI_Notifications_Management", "Storage", "Storage_Streams", "System", "UI",
  "UI_Composition", "UI_Composition_Desktop",
  "Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery", "Win32_Devices_Display", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_Performance", "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx", "Win32_System_SystemServices",
  "Win32_Security", "Win32_Security_Cryptography", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading",
  "Win32_System_WinRT", "Win32_System_WinRT_Composition", "Win32_System_WinRT_Graphics_Direct2D","Win32_UI_HiDpi", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole",
  "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Shutdown", "Win32_System_Power", "Win32_Security_Authentication_Identity",
  "Win32_UI_Accessibility",
] }

# Dependências (principalmente a crate `windows`) sem símbolos de depuração no
# build de dev: o target fica bem menor e as nossas crates continuam com debug
# completo para o depurador.
[profile.dev.package."*"]
debug = false
