[workspace]
resolver = "3"
members = [
  "crates/core",
  "crates/platform",
  "crates/resources",
  "crates/ui",
  "crates/integrations/clock",
  "crates/modules/bar",
  "crates/modules/island-host",
  "crates/modules/island",
  "crates/platform-windows",
  "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[workspace.dependencies]
zefiro-core = { path = "crates/core" }
zefiro-platform = { path = "crates/platform" }
zefiro-resources = { path = "crates/resources" }
zefiro-ui = { path = "crates/ui" }
zefiro-integration-clock = { path = "crates/integrations/clock" }
zefiro-bar = { path = "crates/modules/bar" }
zefiro-island-host = { path = "crates/modules/island-host" }
zefiro-island = { path = "crates/modules/island" }
zefiro-platform-windows = { path = "crates/platform-windows" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"
notify = "8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tempfile = "3"
windows-core = "=0.61.2"
windows-numerics = "=0.2.0"
windows = { version = "=0.61.3", features = [
  "Foundation", "Foundation_Collections", "Foundation_Numerics", "Graphics", "Graphics_DirectX", "Graphics_Imaging", "Media", "Media_Control", "Storage", "Storage_Streams", "System", "UI",
  "UI_Composition", "UI_Composition_Desktop",
  "Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery",
  "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading",
  "Win32_System_WinRT", "Win32_System_WinRT_Composition", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }
