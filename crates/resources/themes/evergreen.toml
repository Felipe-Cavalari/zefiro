# Evergreen — verde profundo. Valores da ilha (Dynamic Island for Windows, MIT).
name = "Evergreen"

[colors]
background     = "#0C1512"
text           = "#E4F1EA"
text_secondary = "#8CAE9D"
border         = "#1A2A23"   # "none" = sem contorno
accent         = "auto"      # auto (capa da ilha) | system | "#RRGGBB"

[material]
opacity        = 0.96
depth          = true
shadow         = true
backdrop       = "none"      # none | acrylic
backdrop_fill  = 0.45

[shape]
style          = "pill"      # pill | w11
radius_max     = 44
panel_radius   = 24

[font]
family         = "Segoe UI Variable"
scale          = 1.0

[animation]
spring         = "default"   # smooth | default | bouncy | snappy
speed          = 1.0
